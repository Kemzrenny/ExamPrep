                    { q: "What is polar coordinate representation (r, theta) of a Cartesian point (x, y)?", options: ["r = sqrt(x² + y²), tan(theta) = y / x", "r = x + y", "r = x * y", "theta = x - y"], answer: "A" },
                    { q: "How do you convert polar coordinates (r, theta) to Cartesian coordinates (x, y)?", options: ["x = r*cos(theta), y = r*sin(theta)", "x = r*sin(theta), y = r*cos(theta)", "x = r + theta", "x = r / theta"], answer: "A" },
                    { q: "What is the area of a sector of a circle with radius r and angle theta in radians?", options: ["1/2 * r² * theta", "r * theta", "pi * r²", "2 * pi * r"], answer: "A" },
                    { q: "What is trigonometric identity for sin²(theta) + cos²(theta)?", options: ["1", "0", "2", "sin(2*theta)"], answer: "A" },
                    { q: "What is the derivative of tan(x)?", options: ["sec²(x)", "csc²(x)", "-sec(x)", "cot(x)"], answer: "A" },
                    { q: "What is the integral of 1 / x with respect to x?", options: ["ln|x| + C", "e^x + C", "-1 / x² + C", "x² / 2 + C"], answer: "A" },
                    { q: "What is integration by substitution (u-substitution) based on?", options: ["The chain rule in reverse", "The product rule", "Matrix inversion", "Integration by parts"], answer: "A" },
                    { q: "What is the centroid of a geometric region?", options: ["The geometric center or average position of all points in the shape", "The highest vertex", "The outer perimeter", "The focal point"], answer: "A" },
                    { q: "What is Gauss's Divergence Theorem in vector calculus?", options: ["Relates a volume integral of divergence to a surface flux integral", "Relates line integrals to surface integrals", "Solves quadratic equations", "Calculates matrix rank"], answer: "A" },
                    { q: "What is Stokes' Theorem?", options: ["Relates a surface integral of curl to a line integral around the boundary curve", "Calculates limits", "Solves differential equations", "Finds roots of polynomials"], answer: "A" },
                    { q: "What is the fundamental theorem of calculus?", options: ["Links the concept of differentiating a function with the concept of integrating it", "States that 1+1=2", "Proves prime numbers are infinite", "Defines matrix multiplication"], answer: "A" },
                    { q: "Why is elementary mathematics II essential for computing and science students?", options: ["It provides the foundational analytical, calculus, and linear algebra tools required for algorithms, graphics, and machine learning", "It is only for memorization", "It replaces programming", "It is required for history essays"], answer: "A" }
                ]
            }
        };

        // Application State
        let activeView = 'dashboard'; // 'dashboard', 'exam', 'result'
        let currentCourseCode = null;
        let currentQuestionIndex = 0;
        let userAnswers = {}; // { questionIndex: 'A'/'B'/'C'/'D' }
        let flaggedQuestions = {}; // { questionIndex: true/false }
        let timerInterval = null;
        let timeLeft = 3600; // 60 minutes in seconds
        let examResultsHistory = {}; // { courseCode: { score, total, percentage, timeSpent, answers } }

        // Render Dashboard
        function showDashboard() {
            activeView = 'dashboard';
            clearInterval(timerInterval);
            document.getElementById('nav-title').innerText = "My courses";
            
            const container = document.getElementById('main-container');
            
            let html = `
                <div class="mb-8">
                    <h1 class="text-2xl font-bold text-gray-900">Dashboard / My Courses</h1>
                    <p class="text-gray-600 text-sm mt-1">Select a course to start your 60-minute CBT examination (60 objective questions per course).</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            `;

            const coursesList = Object.values(examData);
            
            coursesList.forEach(course => {
                const isCompleted = examResultsHistory[course.code] !== undefined;
                const scoreData = examResultsHistory[course.code];
                const progressPct = isCompleted ? 100 : 2;

                html += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <div class="relative h-40 bg-gradient-to-r from-blue-900 to-indigo-900 p-4 flex flex-col justify-between text-white">
                                <div class="absolute top-0 right-4 miva-red text-white text-xs font-bold px-3 py-2 badge-100l shadow">
                                    100L
                                </div>
                                <span class="text-xs bg-black/30 backdrop-blur px-2.5 py-1 rounded-full w-max">${course.school}</span>
                                <h3 class="font-bold text-lg leading-snug">${course.title}</h3>
                            </div>
                            <div class="p-5">
                                <div class="flex justify-between text-xs text-gray-500 mb-1">
                                    <span>Course Progress</span>
                                    <span>${progressPct}% Completed</span>
                                </div>
                                <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                                    <div class="bg-emerald-500 h-full rounded-full" style="width: ${progressPct}%"></div>
                                </div>
                                ${isCompleted ? `
                                    <div class="mt-4 p-2 bg-emerald-50 border border-emerald-200 rounded text-xs text-emerald-800 flex justify-between items-center">
                                        <span>Last Score: <b>${scoreData.score}/${scoreData.total} (${scoreData.percentage}%)</b></span>
                                        <span class="font-semibold uppercase">${scoreData.percentage >= 50 ? 'Passed' : 'Review'}</span>
                                    </div>

                                    <div class="mt-4 text-xs text-gray-500 flex items-center space-x-1">
                                        <i class="fa-regular fa-clock text-blue-600"></i>
                                        <span>60 Questions &bull; 60 Minutes</span>
                                    </div>
                                `}
                            </div>
                        </div>
                        <div class="p-5 pt-0">
                            <button onclick="startExam('${course.code}')" class="w-full bg-[#0b2240] hover:bg-blue-950 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-laptop-code"></i>
                                <span>${isCompleted ? 'Retake CBT Exam' : 'Start CBT Exam'}</span>
                            </button>
                        </div>

            container.innerHTML = html;
        }

        // Start Exam Function
        function startExam(code) {
            currentCourseCode = code;
            currentQuestionIndex = 0;
            userAnswers = {};
            flaggedQuestions = {};
            timeLeft = 3600; // 60 mins
            activeView = 'exam';
            
            document.getElementById('nav-title').innerText = examData[code].title;
            
            renderExamInterface();
            startTimer();
        }

        // Start Countdown Timer
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    alert("Time is up! Your exam will be submitted automatically.");
                    submitExam();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const timerEl = document.getElementById('cbt-timer');
            if (timerEl) {
                timerEl.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                if (timeLeft < 300) { // under 5 mins
                    timerEl.classList.add('text-red-600', 'animate-pulse');
                }
            }
        }

        // Render Exam UI (Miva LMS Style)
        function renderExamInterface() {
            const course = examData[currentCourseCode];
            const q = course.questions[currentQuestionIndex];
            const totalQ = course.questions.length;

            const container = document.getElementById('main-container');

            let html = `
                <div class="mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-4 rounded-xl border border-gray-200 shadow-sm gap-4">
                    <div>
                        <button onclick="showDashboard()" class="text-xs text-blue-600 hover:underline flex items-center space-x-1 mb-1">
                            <i class="fa-solid fa-arrow-left"></i><span>Back to My Courses</span>
                        </button>
                        <h2 class="text-lg font-bold text-gray-900">${course.title}</h2>
                    </div>
                    <div class="flex items-center space-x-4 bg-gray-50 px-4 py-2 rounded-lg border border-gray-200">
                        <div class="flex items-center space-x-2 text-gray-700">
                            <i class="fa-regular fa-clock text-red-600 text-lg"></i>
                            <span class="text-xs uppercase font-semibold text-gray-500">Time Remaining:</span>
                            <span id="cbt-timer" class="font-mono font-bold text-lg text-gray-900">60:00</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                    <!-- QUESTION MAIN PANEL -->
                    <div class="lg:col-span-3 space-y-6">
                        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
                            <!-- Question meta header -->
                            <div class="flex justify-between items-center border-b border-gray-100 pb-4 mb-6">
                                <div class="text-sm font-semibold text-gray-700">
                                    Question <span class="text-blue-600">${currentQuestionIndex + 1}</span> of ${totalQ}
                                </div>
                                <div class="flex items-center space-x-3">
                                    <span class="text-xs text-gray-500">Marked out of 1.00</span>
                                    <button onclick="toggleFlag(${currentQuestionIndex})" class="text-xs px-3 py-1.5 rounded border transition flex items-center space-x-1.5 ${flaggedQuestions[currentQuestionIndex] ? 'bg-amber-50 border-amber-300 text-amber-700' : 'bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100'}">
                                        <i class="fa-solid fa-flag"></i>
                                        <span>${flaggedQuestions[currentQuestionIndex] ? 'Flagged' : 'Flag question'}</span>
                                    </button>
                                </div>
                            </div>

                            <!-- Question text -->
                            <div class="text-gray-900 font-medium text-lg mb-6 leading-relaxed">
                                ${q.q}
                            </div>

                            <!-- Options -->
                            <div class="space-y-3 mb-8">
                                <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Select one:</div>
                            `;

                            const optionLabels = ['A', 'B', 'C', 'D'];
                            q.options.forEach((optText, optIdx) => {
                                const optLetter = optionLabels[optIdx];
                                const isSelected = userAnswers[currentQuestionIndex] === optLetter;
                                html += `
                                    <label class="flex items-start space-x-3 p-3.5 rounded-lg border cursor-pointer transition ${isSelected ? 'border-blue-600 bg-blue-50/50' : 'border-gray-200 hover:bg-gray-50'}" onclick="selectOption('${optLetter}')">
                                        <input type="radio" name="q_option" class="mt-1 text-blue-600 focus:ring-blue-500" ${isSelected ? 'checked' : ''}>
                                        <div class="text-sm text-gray-800"><span class="font-semibold mr-2">${optLetter.toLowerCase()}.</span>${optText}</div>
                                    </label>
                                `;
                            });

                            html += `
                            </div>

                            <!-- Navigation buttons -->
                            <div class="flex justify-between items-center pt-4 border-t border-gray-100">
                                <button onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''} class="px-5 py-2.5 rounded-lg border border-gray-300 text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">
                                    <i class="fa-solid fa-arrow-left mr-2"></i> Previous
                                </button>
                                <div class="flex space-x-3">
                                    ${currentQuestionIndex === totalQ - 1 ? `
                                        <button onclick="confirmSubmit()" class="px-6 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow transition">
                                            Finish Attempt...
                                        </button>
                                    ` : `
                                        <button onclick="nextQuestion()" class="px-6 py-2.5 rounded-lg bg-[#0b2240] hover:bg-blue-950 text-white text-sm font-semibold shadow transition">
                                            Next <i class="fa-solid fa-arrow-right ml-2"></i>
                                        </button>
                                    `}
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- QUIZ NAVIGATION SIDEBAR (Miva Style) -->
                    <div class="lg:col-span-1">
                        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5 sticky top-20">
                            <h3 class="font-bold text-gray-900 mb-3 text-base border-b border-gray-100 pb-2">Quiz navigation</h3>
                            
                            <div class="grid grid-cols-5 gap-2 my-4 max-h-[380px] overflow-y-auto p-1">
            `;

            for (let i = 0; i < totalQ; i++) {
                let statusClass = "bg-white border-gray-300 text-gray-700 hover:bg-gray-100";
                if (userAnswers[i] !== undefined) {
                    statusClass = "bg-blue-600 border-blue-600 text-white font-semibold";
                }
                if (flaggedQuestions[i]) {
                    statusClass += " ring-2 ring-amber-400";
                }
                if (i === currentQuestionIndex) {
                    statusClass += " ring-2 ring-offset-2 ring-blue-900";
                }

                html += `
                    <button onclick="jumpToQuestion(${i})" class="w-10 h-10 rounded border text-xs flex items-center justify-center transition ${statusClass}">
                        ${i + 1}
                    </button>
                `;
            }

            html += `
                            </div>

                            <div class="mt-6 pt-4 border-t border-gray-100">
                                <button onclick="confirmSubmit()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg shadow transition">
                                    Finish attempt...
                                </button>
                            </div>

                            <div class="mt-4 space-y-2 text-xs text-gray-500">
                                <div class="flex items-center space-x-2">
                                    <div class="w-3 h-3 bg-blue-600 rounded"></div>
                                    <span>Answered question</span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <div class="w-3 h-3 bg-white border border-gray-300 rounded"></div>
                                    <span>Not yet answered</span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <div class="w-3 h-3 bg-amber-400 rounded"></div>
                                    <span>Flagged for review</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
            updateTimerDisplay();
        }

        function selectOption(letter) {
            userAnswers[currentQuestionIndex] = letter;
            renderExamInterface();
        }

        function toggleFlag(index) {
            flaggedQuestions[index] = !flaggedQuestions[index];
            renderExamInterface();
        }

        function nextQuestion() {
            if (currentQuestionIndex < examData[currentCourseCode].questions.length - 1) {
                currentQuestionIndex++;
                renderExamInterface();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderExamInterface();
            }
        }

        function jumpToQuestion(index) {
            currentQuestionIndex = index;
            renderExamInterface();
        }

        function confirmSubmit() {
            const totalQ = examData[currentCourseCode].questions.length;
            const answeredCount = Object.keys(userAnswers).length;
            const unanswered = totalQ - answeredCount;

            let msg = `Are you sure you want to submit your exam?\n\nAnswered: ${answeredCount} / ${totalQ}`;
            if (unanswered > 0) {
                msg += `\nWarning: You have ${unanswered} unanswered question(s)!`;
            }

            if (confirm(msg)) {
                submitExam();
            }
        }

        // Submit and Calculate Score
        function submitExam() {
            clearInterval(timerInterval);
            const course = examData[currentCourseCode];
            let score = 0;
            const total = course.questions.length;

            course.questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.answer) {
                    score++;
                }
            });

            const percentage = Math.round((score / total) * 100);
            const timeSpentSecs = 3600 - timeLeft;
            const minutesSpent = Math.floor(timeSpentSecs / 60);
            const secondsSpent = timeSpentSecs % 60;

            examResultsHistory[currentCourseCode] = {
                score,
                total,
                percentage,
                timeSpent: `${minutesSpent}m ${secondsSpent}s`,
                answers: { ...userAnswers }
            };

            renderResultView(score, total, percentage, `${minutesSpent}m ${secondsSpent}s`);
        }

        // Render Result View
        function renderResultView(score, total, percentage, timeSpent) {
            activeView = 'result';
            const course = examData[currentCourseCode];
            const container = document.getElementById('main-container');

            let gradeColor = "text-emerald-600 bg-emerald-50 border-emerald-200";
            let gradeText = "Excellent Performance!";
            if (percentage < 50) {
                gradeColor = "text-red-600 bg-red-50 border-red-200";
                gradeText = "Needs Improvement";
            } else if (percentage < 70) {
                gradeColor = "text-amber-600 bg-amber-50 border-amber-200";
                gradeText = "Good Effort!";
            }

            let html = `
                <div class="max-w-4xl mx-auto bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden my-6">
                    <div class="miva-nav text-white p-6 sm:p-8 flex flex-col sm:flex-row justify-between items-start sm:items-center">
                        <div>
                            <span class="text-xs bg-white/20 px-3 py-1 rounded-full uppercase tracking-wider">${course.code} Examination</span>
                            <h1 class="text-2xl font-bold mt-2">${course.title}</h1>
                            <p class="text-gray-300 text-sm mt-1">Completed Assessment Summary & Score Report</p>
                        </div>
                        <div class="mt-4 sm:mt-0 bg-white/10 px-5 py-3 rounded-xl backdrop-blur text-right">
                            <div class="text-xs text-gray-300">Time Spent</div>
                            <div class="font-mono text-lg font-bold">${timeSpent}</div>
                        </div>
                    </div>

                    <div class="p-6 sm:p-8">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div class="bg-gray-50 border border-gray-200 rounded-xl p-6 text-center">
                                <div class="text-xs text-gray-500 uppercase font-semibold">Final Score</div>
                                <div class="text-4xl font-extrabold text-gray-900 mt-2">${score} <span class="text-xl text-gray-400">/ ${total}</span></div>
                            </div>
                            <div class="bg-gray-50 border border-gray-200 rounded-xl p-6 text-center">
                                <div class="text-xs text-gray-500 uppercase font-semibold">Percentage</div>
                                <div class="text-4xl font-extrabold text-blue-600 mt-2">${percentage}%</div>
                            </div>
                            <div class="border rounded-xl p-6 text-center ${gradeColor}">
                                <div class="text-xs uppercase font-semibold">Status</div>
                                <div class="text-lg font-bold mt-2">${gradeText}</div>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-4 justify-between items-center pt-6 border-t border-gray-200">
                            <button onclick="showDashboard()" class="w-full sm:w-auto px-6 py-3 rounded-lg bg-[#0b2240] hover:bg-blue-950 text-white font-semibold text-sm transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-house"></i>
                                <span>Return to Dashboard</span>
                            </button>
                            <button onclick="startExam('${course.code}')" class="w-full sm:w-auto px-6 py-3 rounded-lg border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold text-sm transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>Retake Exam</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- DETAILED REVIEW SECTION -->
                <div class="max-w-4xl mx-auto bg-white rounded-2xl border border-gray-200 shadow-sm p-6 sm:p-8">
                    <h3 class="text-xl font-bold text-gray-900 mb-6 border-b border-gray-200 pb-3">Detailed Question Review</h3>
                    <div class="space-y-6">
            `;

            const optionLabels = ['A', 'B', 'C', 'D'];
            course.questions.forEach((q, idx) => {
                const userAns = examResultsHistory[currentCourseCode].answers[idx] || "Not Answered";
                const isCorrect = userAns === q.answer;

                html += `
                    <div class="border rounded-xl p-5 ${isCorrect ? 'border-emerald-200 bg-emerald-50/30' : 'border-red-200 bg-red-50/30'}">
                        <div class="flex justify-between items-start mb-3">
                            <span class="font-bold text-sm text-gray-700">Question ${idx + 1}</span>
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">
                                ${isCorrect ? 'Correct' : 'Incorrect / Unanswered'}
                            </span>
                        </div>
                        <div class="text-gray-900 font-medium mb-4">${q.q}</div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
                `;

                q.options.forEach((optText, optIdx) => {
                    const optLetter = optionLabels[optIdx];
                    let optStyle = "bg-white border-gray-200 text-gray-700";
                    if (optLetter === q.answer) {
                        optStyle = "bg-emerald-100 border-emerald-300 text-emerald-900 font-semibold";
                    } else if (optLetter === userAns && !isCorrect) {
                        optStyle = "bg-red-100 border-red-300 text-red-900 font-semibold";
                    }

                    html += `
                        <div class="p-3 rounded-lg border text-xs flex items-center space-x-2 ${optStyle}">
                            <span class="font-bold">${optLetter}.</span>
                            <span>${optText}</span>
                        </div>
                    `;
                });

                html += `
                        </div>
                        <div class="text-xs text-gray-600 mt-2">
                            Your answer: <b class="${isCorrect ? 'text-emerald-700' : 'text-red-700'}">${userAns}</b> &bull; Correct Answer: <b class="text-emerald-700">${q.answer}</b>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // Initialize App on load
        window.onload = function() {
            showDashboard();
        };
    </script>
</body>
</html>
